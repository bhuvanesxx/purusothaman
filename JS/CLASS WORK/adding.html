<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <label for="oneInput">First number</label>
    <input type="number" id="oneInput" step="any">
    <label for="twoInput">Second number</label>
    <input type="number" id="twoInput" step="any">
    <button type="button" id="addButton">Add</button>
    <button type="button" id="subButton">Subtract</button>
    <button type="button" id="mulButton">Multiply</button>
    <button type="button" id="divButton">Divide</button>
    <p id="showing" aria-live="polite"></p>
    <script src="assets/js/index.js"></script>
</body>
</html>
